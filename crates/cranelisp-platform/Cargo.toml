[package]
name = "cranelisp-platform"
version = "0.1.0"
edition = "2024"

# Single-ABI cutover (S96, `design/arch/platform-interface.md` §6.8.0): the
# former off-by-default `concurrency` feature is RETIRED — the host-reactor ABI
# contracts (`HostCtx`/`Waker`/`PollFn`/`ConcurrencyDescriptor`) + `poll_support`
# are now CORE (always compiled, on the default `public-api.txt` edge).

[dependencies]
cranelisp-types = { path = "../cranelisp-types" }
