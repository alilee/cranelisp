[package]
name = "cranelisp-intrinsics"
version = "0.1.0"
edition = "2024"

[features]
# Exposes the strand-identity + trampoline observability event-stream plumbing
# (`StrandId`, `StrandEvent`) for the slice-2 async substrate. Off by default
# (byte-identical-when-off — observability costs nothing in `--link`/`--release`)
# and out of the `public-api.txt` baseline until the reactor wires the emit
# hooks. See `design/arch/effect-concurrency.md` §11.
concurrency = ["cranelisp-types/concurrency", "cranelisp-platform/concurrency"]

# The slice-2 reactor IMPLEMENTATION (effect-concurrency track — the async
# substrate). Builds on the `concurrency` layout contracts and adds the two
# single-purpose runtime deps the host reactor needs:
#   - `mio`     — the cross-platform epoll/kqueue/IOCP abstraction the host
#                 reactor drives (the `HostCtx` C-ABI is mio-shaped: register a
#                 raw fd + a waker — `design/arch/effect-concurrency.md` App. B).
#   - `futures` — `join_all` for the `Par`-async overlap path + task/waker glue.
# Both are `dep:`-gated optional dependencies, so with the feature OFF cargo
# never compiles or links them. NOT in default features; the exe-bundle/`--link`
# build path never enables it ⇒ a linked binary is byte-identical and
# executor-free (the "platforms carry no runtime" thesis, preserved
# structurally). The strand observability sink + the async trampoline emit
# hooks are also gated here.
concurrency-runtime = ["concurrency", "dep:mio", "dep:futures"]

[dependencies]
cranelisp-types = { path = "../cranelisp-types" }
cranelisp-platform = { path = "../cranelisp-platform" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
# Reactor runtime deps — optional, `dep:`-gated by `concurrency-runtime` (above).
mio = { version = "1", features = ["os-poll", "os-ext"], optional = true }
futures = { version = "0.3", optional = true }
