[package]
name = "cranelisp-async-demo"
version = "0.1.0"
edition = "2024"

# In-tree async-capable demo platform (S94 R2/R6): a real `declare_platform!`-
# emitted poll-shape leaf (`descriptor: blocking = 0`) driven through the full
# macro -> backend -> loader -> `cranelisp_run_io` path. NO separate cdylib
# fixture is needed beyond this workspace member; the host dlopens the built
# `libcranelisp_async_demo.{so,dylib}` from `target/debug/`. Single-ABI cutover
# (§6.8.0): poll-shape is a per-effect descriptor on the unified manifest — no
# `concurrency` feature.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cranelisp-platform = { path = "../../crates/cranelisp-platform" }
libc = "0.2"
