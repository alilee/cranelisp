[package]
name = "cranelisp-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
cranelisp-types = { path = "../cranelisp-types" }
cranelisp-runtime = { path = "../cranelisp-runtime" }
cranelift = "0.116"
cranelift-module = "0.116"
cranelift-jit = "0.116"
cranelift-native = "0.116"
cranelift-codegen = { version = "0.116", features = ["disas"] }
cranelift-object = "0.116"
target-lexicon = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
object = { version = "0.36", default-features = false, features = ["read", "std"] }
memmap2 = "0.9"
libc = "0.2"
dashmap = "6"

[dev-dependencies]
tempfile = "3"
