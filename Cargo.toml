[workspace]
members = [
    ".",
    "crates/cranelisp-types",
    "crates/cranelisp-frontend",
    "crates/cranelisp-typecheck",
    "crates/cranelisp-backend",
    "crates/cranelisp-runtime",
    "crates/cranelisp-platform",
    "crates/cranelisp-exe-bundle",
    "platforms/stdio",
    "platforms/test-capture",
]
resolver = "2"

[package]
name = "cranelisp"
version = "0.1.0"
edition = "2024"

[dependencies]
cranelisp-types = { path = "crates/cranelisp-types" }
cranelisp-frontend = { path = "crates/cranelisp-frontend" }
cranelisp-typecheck = { path = "crates/cranelisp-typecheck" }
cranelisp-backend = { path = "crates/cranelisp-backend" }
cranelisp-runtime = { path = "crates/cranelisp-runtime" }
cranelisp-platform = { path = "crates/cranelisp-platform" }

# Sprint 58 Wave 2 / Decision 36: the `--link` `_main` entry-point alias
# generator (`src/exe.rs::generate_main_alias_object`) emits a small
# Cranelift-compiled `.o` defining `_main` as `Linkage::Export` that
# tail-calls into the entry module's GOT. Cranelift APIs are accessed
# directly here (rather than via re-export from cranelisp-backend) because
# the alias is `/int`-owned per Decision 36's "lives outside
# `compile_to_module`" framing — `/backend` keeps generic-blind.
cranelift = "0.116"

[dependencies.dashmap]
version = "6"

[dependencies.libc]
version = "0.2"

[dependencies.libloading]
version = "0.8"

[dependencies.notify]
version = "7"

[[bin]]
name = "cranelisp"
path = "src/main.rs"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
