[package]
name = "cranelisp-intrinsics"
version = "0.1.0"
edition = "2024"

# Single-ABI + single-trampoline cutover (S96, `design/arch/platform-interface.md`
# §6.8.0a): BOTH the `concurrency` (layout) and `concurrency-runtime` (reactor)
# features are RETIRED. The reactor IS the runtime — `reactor`/`strand`, mio, and
# futures are now UNCONDITIONAL. A pure-blocking program drains synchronously
# through the one (async) trampoline and constructs no mio `Poll` (lazy reactor
# init — `design/intrinsics/reactor.md`); lean-default is a RUNTIME property, not a
# `#[cfg]` split.

[dependencies]
cranelisp-types = { path = "../cranelisp-types" }
cranelisp-platform = { path = "../cranelisp-platform" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
# Host-reactor runtime deps — now UNCONDITIONAL (the reactor is always linked;
# §6.8.0a). `mio` = the epoll/kqueue/IOCP abstraction the `HostCtx` reactor drives;
# `futures` = `join_all` for the `Par`-async overlap + task/waker glue.
mio = { version = "1", features = ["os-poll", "os-ext"] }
futures = { version = "0.3" }
