[package]
name = "cranelisp-stdio"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cranelisp-platform = { path = "../../crates/cranelisp-platform" }
# `read-line` is a poll-shape leaf: it does a non-blocking `libc::read` on stdin
# (fd 0) and registers fd-readiness with the host reactor on EWOULDBLOCK.
libc = "0.2"
