[workspace]
members = [
    ".",
    "crates/cranelisp-types",
    "crates/cranelisp-frontend",
    "crates/cranelisp-typecheck",
    "crates/cranelisp-backend",
    "crates/cranelisp-primitives",
    "crates/cranelisp-intrinsics",
    "crates/cranelisp-platform",
    "crates/cranelisp-exe-bundle",
    "platforms/stdio",
    "platforms/test-capture",
    "platforms/shapes",
    "platforms/shapes-badabi",
    "platforms/boom",
    "platforms/async-demo",
    "exemplar/platforms/web",
]
resolver = "2"

[workspace.dependencies]
# Sprint 66 Wave 2 Batch A: D43 runtime split crate skeletons. Path deps
# declared at the workspace level so consumers can opt in via
# `dep.workspace = true` once Wave 3b lands the source migration. Sibling
# crates currently still declare path deps inline (workspace dep convention
# was introduced with these two crates).
cranelisp-primitives = { path = "crates/cranelisp-primitives", version = "0.1.0" }
cranelisp-intrinsics = { path = "crates/cranelisp-intrinsics", version = "0.1.0" }

[package]
name = "cranelisp"
version = "0.1.0"
edition = "2024"

[dependencies]
cranelisp-types = { path = "crates/cranelisp-types" }
cranelisp-frontend = { path = "crates/cranelisp-frontend" }
cranelisp-typecheck = { path = "crates/cranelisp-typecheck" }
cranelisp-backend = { path = "crates/cranelisp-backend" }
cranelisp-intrinsics = { workspace = true }
cranelisp-primitives = { workspace = true }
cranelisp-platform = { path = "crates/cranelisp-platform" }

# Sprint 58 Wave 2 / Decision 36: the `--link` `_main` entry-point alias
# generator (`src/exe.rs::generate_main_alias_object`) emits a small
# Cranelift-compiled `.o` defining `_main` as `Linkage::Export` that
# tail-calls into the entry module's GOT. Cranelift APIs are accessed
# directly here (rather than via re-export from cranelisp-backend) because
# the alias is `/int`-owned per Decision 36's "lives outside
# `compile_to_module`" framing — `/backend` keeps generic-blind.
cranelift = "0.116"

[dependencies.dashmap]
version = "6"

[dependencies.libc]
version = "0.2"

[dependencies.libloading]
version = "0.8"

[dependencies.notify]
version = "7"

# Sprint 58 Wave 4 Step 5d (iii): Cranelisp.toml project configuration
# parser (`src/session.rs::load_project_config_lib_dirs`). Spec
# §8.11.4 item 2 — closes inline FIXME(/int) at spec/08-modules.md:639,648.
[dependencies.toml]
version = "0.8"

# Required by `toml::from_str` for Deserialize derives in
# `src/session.rs::ProjectConfig`. (Already a transitive dep through
# cranelisp-types.)
[dependencies.serde]
version = "1"
features = ["derive"]

# FIXME 0336: a `bench`-gated, in-process accessor for the IO-trace off-path
# `record_event` cost (unblocks FIXME 0021 — the release-mode criterion bench
# that measures the filter-OFF per-call cost at nanosecond resolution). The
# feature gates `io_trace::bench_record_event_off_path` (and nothing else); it
# is OFF by default so the normal build/test path is unaffected. No `[lib]`
# target is added (none is needed — `src/lib.rs` already exposes `pub mod
# io_trace`, so a `benches/` unit links it via `use cranelisp::io_trace::…`);
# the accessor is purely additive (Principle 8 — no interim scaffolding).
[features]
bench = []
# Sprint 94 Phase 5 (effect-concurrency / reactor-e2e track): passthrough that
# turns on the slice-2 host reactor IMPLEMENTATION via the intrinsics crate, so
# `cargo ... -p cranelisp --features concurrency-runtime` builds the binary with
# the runtime linked (the `nt-reactor-e2e` lane in `.cargo/config.toml` uses
# exactly this). `cranelisp-intrinsics/concurrency-runtime` is a strict superset
# of `concurrency` (pulls the optional `mio`/`futures` deps and transitively
# enables `cranelisp-platform/concurrency` + `cranelisp-types/concurrency`), so a
# single passthrough covers the whole chain. OFF by default — in NO default
# feature set, so `cargo build` / `cargo nextest run` (the `nt` lane) and the
# `--link` exe-bundle path never compile or link the runtime; a default/linked
# binary stays byte-identical and executor-free ("platforms carry no runtime").
# See design/arch/effect-concurrency.md §11 + sprints/SPRINT.md Wave 0.
# Sprint 94 (FIXME 0457): the binary-side `concurrency` cfg — enables the v7
# layout-contract types in the loader (`src/platform.rs` probes
# `cranelisp_concurrent_manifest` + lifts `ConcurrencyDescriptor` to set
# `DefKind::PlatformEffect.poll_shape`). Additive, OFF by default (no default
# feature set), so the default `nt` build never compiles the v7 probe and stays
# byte-identical. Implied by `concurrency-runtime` (the reactor needs the v7
# channel to feed it real poll nodes).
concurrency = ["cranelisp-platform/concurrency", "cranelisp-types/concurrency"]
concurrency-runtime = ["concurrency", "cranelisp-intrinsics/concurrency-runtime"]
# Sprint 88 Phase 5 (agentic-REPL track, Wave 3 — Advisor MVP core): the
# embedded agent. OFF by default — in NO default feature set, enabled by no
# dev-dependency, so `cargo build` / `cargo nextest run` never compile it and
# the ~9s default suite stays agent-free (design/int/agent.md §6.4). All of
# `src/agent/` is `#[cfg(feature = "agent")]`. The `agent` feature pulls in the
# `rig-core` LLM client (`rig::completion::CompletionModel` is the
# provider-agnostic boundary, R3-amended) and a current-thread `tokio` runtime
# (rig's completion methods are async; `agent_turn` is synchronous to the user's
# Enter, so it `block_on`s a current-thread runtime).
agent = ["dep:rig-core", "dep:tokio", "dep:serde_json"]

# Sprint 88 Phase 5 Wave 3: the embedded-agent LLM client, optional + gated by
# the `agent` feature (above). `default-features = false` drops rig's default
# derive/reqwest/rustls bundle; we opt back in only the transport the HTTP
# providers need — `reqwest` (the HTTP client the Anthropic + Ollama providers
# use) + `native-tls` (TLS via the system OpenSSL). Providers are NOT
# individually feature-gated in rig-core 0.39.0 (they live under
# `rig::providers::*` and are always compiled once `rig-core` is a dep —
# design/int/agent.md §6.4 verification note); `reqwest`+`native-tls` is the
# smallest set that compiles the completion API + the anthropic/ollama providers
# (verified against 0.39.0). native-tls is chosen over rustls deliberately: the
# rustls path pulls `aws-lc-rs` (a heavy C TLS backend requiring a C toolchain
# and ~30 MB of build artifacts), whereas native-tls links the system OpenSSL —
# a far lighter agent-feature footprint with no extra C build.
[dependencies.rig-core]
version = "0.39.0"
optional = true
default-features = false
features = ["reqwest", "native-tls"]

# rig's `CompletionModel::completion` is async; `agent_turn` is synchronous to
# the user's Enter (it holds the REPL-cadence `&mut CompilerSession` on the eval
# thread). A current-thread tokio runtime lets `agent_turn` `block_on` a single
# completion call without spawning threads. `rt` + `macros` is the minimal set;
# no multi-thread runtime is needed (one blocking call per loop iteration).
[dependencies.tokio]
version = "1"
optional = true
features = ["rt", "macros"]

# Agent-only: build the rig tool-definition JSON schema + decode tool-call
# arguments (`src/agent/request.rs`). `serde_json` is already a transitive dep
# (through `toml` / rig); declared optional + gated by the `agent` feature so the
# default build's dependency surface is unchanged.
[dependencies.serde_json]
version = "1"
optional = true

[[bin]]
name = "cranelisp"
path = "src/main.rs"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
regex = "1"
once_cell = "1"
criterion = "0.5"

# Release-mode REPL startup-latency benchmark (relocated S81 from
# tests/build_confidence.rs — FIXME 0326). Not part of the nextest suite;
# run via `cargo build --release && cargo bench --bench startup_latency`.
[[bench]]
name = "startup_latency"
harness = false

# IO-trace off-path overhead microbench (FIXME 0021 / 0336). Measures the
# filter-OFF `record_event` per-call cost in-process at nanosecond resolution
# against a no-op baseline, establishing the <1% off-path bound
# (design/backend/archive/io-trampoline-trace.md §9 AC 2). Calls the
# `bench`-gated `io_trace::bench_record_event_off_path` accessor, so run with:
#   cargo bench --features bench --bench io_trace_off_path
# Not part of the nextest suite.
[[bench]]
name = "io_trace_off_path"
harness = false
