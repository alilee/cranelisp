[package]
name = "cranelisp-intrinsics"
version = "0.1.0"
edition = "2024"

# The reactor is the runtime: `reactor`/`strand`, mio and futures are always
# compiled in, with one ABI and one trampoline for every mode. Each top-level
# drive constructs its reactor eagerly (one `mio::Poll` plus its waker), so a
# pure-blocking program pays those syscalls but never turns the reactor.
# Lean-default is a runtime property, not a `#[cfg]` split
# (`design/intrinsics/reactor.md`).

[dependencies]
cranelisp-types = { path = "../cranelisp-types" }
cranelisp-platform = { path = "../cranelisp-platform" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
# Host-reactor runtime deps. `mio` = the epoll/kqueue/IOCP abstraction the
# `HostCtx` reactor drives; `futures` = `join_all` for the `Par`-async overlap
# + task/waker glue.
mio = { version = "1", features = ["os-poll", "os-ext"] }
futures = { version = "0.3" }
