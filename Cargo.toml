[workspace]
members = [
    ".",
    "crates/cranelisp-types",
    "crates/cranelisp-frontend",
    "crates/cranelisp-typecheck",
    "crates/cranelisp-backend",
    "crates/cranelisp-primitives",
    "crates/cranelisp-intrinsics",
    "crates/cranelisp-platform",
    "crates/cranelisp-exe-bundle",
    "platforms/stdio",
    "platforms/test-capture",
    "platforms/shapes",
    "platforms/shapes-badabi",
    "platforms/boom",
    "exemplar/platforms/web",
]
resolver = "2"

[workspace.dependencies]
# Sprint 66 Wave 2 Batch A: D43 runtime split crate skeletons. Path deps
# declared at the workspace level so consumers can opt in via
# `dep.workspace = true` once Wave 3b lands the source migration. Sibling
# crates currently still declare path deps inline (workspace dep convention
# was introduced with these two crates).
cranelisp-primitives = { path = "crates/cranelisp-primitives", version = "0.1.0" }
cranelisp-intrinsics = { path = "crates/cranelisp-intrinsics", version = "0.1.0" }

[package]
name = "cranelisp"
version = "0.1.0"
edition = "2024"

[dependencies]
cranelisp-types = { path = "crates/cranelisp-types" }
cranelisp-frontend = { path = "crates/cranelisp-frontend" }
cranelisp-typecheck = { path = "crates/cranelisp-typecheck" }
cranelisp-backend = { path = "crates/cranelisp-backend" }
cranelisp-intrinsics = { workspace = true }
cranelisp-primitives = { workspace = true }
cranelisp-platform = { path = "crates/cranelisp-platform" }

# Sprint 58 Wave 2 / Decision 36: the `--link` `_main` entry-point alias
# generator (`src/exe.rs::generate_main_alias_object`) emits a small
# Cranelift-compiled `.o` defining `_main` as `Linkage::Export` that
# tail-calls into the entry module's GOT. Cranelift APIs are accessed
# directly here (rather than via re-export from cranelisp-backend) because
# the alias is `/int`-owned per Decision 36's "lives outside
# `compile_to_module`" framing — `/backend` keeps generic-blind.
cranelift = "0.116"

[dependencies.dashmap]
version = "6"

[dependencies.libc]
version = "0.2"

[dependencies.libloading]
version = "0.8"

[dependencies.notify]
version = "7"

# Sprint 58 Wave 4 Step 5d (iii): Cranelisp.toml project configuration
# parser (`src/session.rs::load_project_config_lib_dirs`). Spec
# §8.11.4 item 2 — closes inline FIXME(/int) at spec/08-modules.md:639,648.
[dependencies.toml]
version = "0.8"

# Required by `toml::from_str` for Deserialize derives in
# `src/session.rs::ProjectConfig`. (Already a transitive dep through
# cranelisp-types.)
[dependencies.serde]
version = "1"
features = ["derive"]

# FIXME 0336: a `bench`-gated, in-process accessor for the IO-trace off-path
# `record_event` cost (unblocks FIXME 0021 — the release-mode criterion bench
# that measures the filter-OFF per-call cost at nanosecond resolution). The
# feature gates `io_trace::bench_record_event_off_path` (and nothing else); it
# is OFF by default so the normal build/test path is unaffected. No `[lib]`
# target is added (none is needed — `src/lib.rs` already exposes `pub mod
# io_trace`, so a `benches/` unit links it via `use cranelisp::io_trace::…`);
# the accessor is purely additive (Principle 8 — no interim scaffolding).
[features]
bench = []

[[bin]]
name = "cranelisp"
path = "src/main.rs"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
regex = "1"
once_cell = "1"
criterion = "0.5"

# Release-mode REPL startup-latency benchmark (relocated S81 from
# tests/build_confidence.rs — FIXME 0326). Not part of the nextest suite;
# run via `cargo build --release && cargo bench --bench startup_latency`.
[[bench]]
name = "startup_latency"
harness = false

# IO-trace off-path overhead microbench (FIXME 0021 / 0336). Measures the
# filter-OFF `record_event` per-call cost in-process at nanosecond resolution
# against a no-op baseline, establishing the <1% off-path bound
# (design/backend/archive/io-trampoline-trace.md §9 AC 2). Calls the
# `bench`-gated `io_trace::bench_record_event_off_path` accessor, so run with:
#   cargo bench --features bench --bench io_trace_off_path
# Not part of the nextest suite.
[[bench]]
name = "io_trace_off_path"
harness = false
