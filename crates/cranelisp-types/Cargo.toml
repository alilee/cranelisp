[package]
name = "cranelisp-types"
version = "0.1.0"
edition = "2024"

[features]
# Exposes `cranelisp_types::test_support` (a generic, content-agnostic
# SymbolTable builder) to OTHER crates' test suites — notably
# `cranelisp-typecheck`'s unit tests. Pure `#[cfg(test)]` is crate-local
# and would not be visible downstream, so the helpers are gated behind this
# feature. The `public-api.txt` baseline is generated WITHOUT this feature,
# so `test_support` never enters the production contract — that is what makes
# the test-only delineation enforceable. See `bounded-contexts.md` §7.
test-support = []

# Exposes the ABI-v7 effect-concurrency layout contracts
# (`ConcurrencyDescriptor`, `Poll`, `PollFn`) to the slice-2 async substrate.
# Off by default and generated WITHOUT this feature in the `public-api.txt`
# baseline, so the v7 contracts stay out of the frozen edge until the reactor
# implementation (`/dev`, next sprint/stretch) wires them. Mirrors the
# `test-support` out-of-baseline discipline. See
# `design/arch/effect-concurrency.md` §5/§6/§12.
concurrency = []

[dependencies]
dashmap = "6"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
