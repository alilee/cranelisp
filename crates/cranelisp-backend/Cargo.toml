[package]
name = "cranelisp-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
cranelisp-types = { path = "../cranelisp-types" }
# Decision 0048 §"Structural invariant — backend dep-ban" — this crate MUST
# NOT depend on the user-callable primitives crate. Dispatch reaches
# primitive fn ptrs exclusively through the cross-module SymbolTable + GOT
# mechanism in cranelisp-types. Compliance: tests/no_primitives_dep.rs.
cranelisp-intrinsics = { path = "../cranelisp-intrinsics" }
cranelift = "0.116"
cranelift-module = "0.116"
cranelift-jit = "0.116"
cranelift-native = "0.116"
cranelift-codegen = { version = "0.116", features = ["disas"] }
cranelift-object = "0.116"
# Raw-bytes disassembler for the on-demand `produce_disasm` path (S75 W3,
# /arch-blessed — already transitive via cranelift's `disas` feature, so ~zero
# incremental build cost). See `facades/backend.md` §"Consumed surface".
capstone = "0.12"
target-lexicon = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
object = { version = "0.36", default-features = false, features = ["read", "std"] }
memmap2 = "0.9"
libc = "0.2"
dashmap = "6"

[dev-dependencies]
tempfile = "3"
